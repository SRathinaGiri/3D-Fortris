<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#020617">
  <title>Fortris Controller</title>
  <link rel="icon" type="image/svg+xml" href="./assets/favicon.svg">
  <link rel="stylesheet" href="./css/styles.css?v=2.0.1">
  <!-- PeerJS 1.5.5 (MIT, bundled locally): pairing with the game. See js/lib/peerjs.LICENSE.txt -->
  <script src="./js/lib/peerjs.min.js?v=1.5.5"></script>
  <!-- Same release pinning as the game: modules always load as one version -->
  <script type="importmap">
  {
    "imports": {
      "./js/config.js": "./js/config.js?v=2.0.1",
      "./js/link.js": "./js/link.js?v=2.0.1"
    }
  }
  </script>
</head>
<body class="pad-body">
  <main class="pad-page">
    <header class="app-header">
      <div class="brand-title"><span>📲 Fortris controller</span></div>
    </header>

    <section class="card" id="pairCard">
      <p class="muted">Open <strong>📲 Phone controller</strong> in the game on your TV or glasses screen, then enter the 6-digit code it shows. This phone must be on the same Wi-Fi.</p>
      <input id="codeInput" class="code-input" inputmode="numeric" pattern="[0-9]*" maxlength="6" autocomplete="off" aria-label="Pairing code" placeholder="000000">
      <button class="action-btn" id="connectBtn">Connect</button>
      <p class="link-status" id="padStatus" role="status"></p>
    </section>

    <section class="card hidden" id="padCard">
      <div class="pad-tv" id="tvStatus" role="status">Connected</div>
      <p class="pad-next" id="nextInfo"></p>
      <div class="pad-dir">
        <button class="pad-btn up" data-b="up" data-repeat="1" aria-label="Move away">▲</button>
        <button class="pad-btn left" data-b="left" data-repeat="1" aria-label="Move left">◀</button>
        <button class="pad-btn mid primary" data-b="confirm" aria-label="OK on the screen's panel">OK</button>
        <button class="pad-btn right" data-b="right" data-repeat="1" aria-label="Move right">▶</button>
        <button class="pad-btn down" data-b="down" data-repeat="1" aria-label="Move toward you">▼</button>
      </div>
      <div class="pad-grid">
        <button class="pad-btn rot" data-b="rotX">⟲ X</button>
        <button class="pad-btn rot" data-b="rotY">⟲ Y</button>
        <button class="pad-btn rot" data-b="rotZ">⟲ Z</button>
        <button class="pad-btn drop primary" data-b="drop">⤓ DROP</button>
        <button class="pad-btn" data-b="turnL" aria-label="Turn the camera left">↶ View</button>
        <button class="pad-btn" data-b="pause">⏸ Pause</button>
        <button class="pad-btn" data-b="turnR" aria-label="Turn the camera right">View ↷</button>
      </div>
      <p class="hint" id="panelHint"></p>
      <button class="link-btn" id="disconnectBtn">Disconnect</button>
    </section>
  </main>
  <script type="module" src="./js/pad.js?v=2.0.1"></script>
</body>
</html>
